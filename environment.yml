# Analysis environment (Windows 11, Python 3.12). Versions are those used for the article.
#   conda env create -f environment.yml
#   conda activate seer-bc-ipcw-smotenc
name: seer-bc-ipcw-smotenc
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - numpy==1.26.4
      - pandas==2.3.3
      - scipy==1.16.3
      - scikit-learn==1.7.2
      - scikit-survival==0.26.0
      - xgboost==3.1.2
      - imbalanced-learn==0.14.0
      - matplotlib==3.10.8
      - pillow==12.0.0
      - pyarrow==25.0.1
      - joblib==1.5.3
      - nbformat==5.10.4
      - nbclient==0.10.2
      - nbconvert==7.16.6
      - ipykernel==6.31.0
      - jupyter_client==8.6.3
      - jupyter_core==5.9.1
